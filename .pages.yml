  - name: homepage_music
    label: Homepage Music / Featured Cards
    type: file
    path: content/home-music.json
    format: json
    list: true
    fields:
      - name: recording
        label: Recording to feature (choose ONE source)
        type: reference
        description: Select a published recording to start playback when tapped. Leave blank for an artwork-only card. Draft recordings are hidden automatically.
        options:
          collection: recordings
          value: "{fields.slug}"
          label: "{fields.title}"
          search: "title"
      - name: visual
        label: Visual Archive image (artwork-only card, or cover fallback)
        type: reference
        description: With no recording selected, show this image as an artwork card. With a recording selected, use this image as a fallback homepage cover override. The dedicated Homepage-only artwork override takes priority.
        options:
          collection: visuals
          value: "{fields.slug}"
          label: "{fields.title}"
          search: "title"
      - name: artwork_visual_override
        label: Homepage-only artwork from Visual Archive (optional)
        type: reference
        description: Optional override for this featured card only. Choose an image from Visual Archive; leaves the original recording cover unchanged.
        options:
          collection: visuals
          value: "{fields.slug}"
          label: "{fields.title}"
          search: "title"
      - name: title
        label: Homepage card title override (optional)
        type: string
        description: Leave blank to use the selected recording or artwork title.
      - name: subtitle
        label: Small caption under the title (optional)
        type: string
        description: e.g. Website-exclusive demo, Single, or Artwork archive.
      - name: hidden
        label: Hide this homepage card
        type: boolean
  - name: homepage_visuals
    label: Homepage Visual Archive / Featured Images
    type: file
    path: content/home-visuals.json
    format: json
    list: true
    fields:
      - name: visual
        label: Artwork to show on homepage
        type: reference
        required: true
        description: Choose a published Visual Archive image. Drag the list entries to arrange the home gallery; you can show as many or as few as you want.
        options:
          collection: visuals
          value: "{fields.slug}"
          label: "{fields.title}"
          search: "title"
      - name: hidden
        label: Hide this image from homepage
        type: boolean
  - name: recordings
    label: Music / Official releases & demos
    type: collection
    path: content/recordings
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: title
      fields: [title, kind, release_type, status, date]
      sort: [title, date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Recording title
        type: string
        required: true
      - name: slug
        label: Unique URL slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: e.g. midnight-demo-01 — do not reuse a slug
      - name: kind
        label: Music category (choose one)
        type: select
        required: true
        options:
          values:
            - name: official
              label: Official release
            - name: demo
              label: Website-exclusive demo
      - name: release_type
        label: Recording format (choose one)
        type: select
        required: true
        options:
          values:
            - name: single
              label: Single
            - name: ep
              label: EP
            - name: album
              label: Album
            - name: demo
              label: Demo
            - name: collection
              label: Collection
      - name: status
        label: Publishing status
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Draft — hidden from site
            - name: published
              label: Published — visible on site
      - name: date
        label: Recording / release date
        type: date
      - name: description
        label: Description and liner notes
        type: text
      - name: artwork
        label: Cover art
        type: image
        options:
          media: artwork
      - name: artwork_visual
        label: Use Visual Archive image as primary cover (optional)
        type: reference
        description: If set to a published Visual Archive image, that image becomes this recording's primary cover. Its original uploaded cover is kept as the fallback. Leave empty to use the uploaded cover.
        options:
          collection: visuals
          value: "{fields.slug}"
          label: "{fields.title}"
          search: "title"
      - name: featured
        label: Featured near top
        type: boolean
      - name: order
        label: Display order (smaller first)
        type: number
      - name: tracks
        label: Track list
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Track title
            type: string
            required: true
          - name: audio_url
            label: Direct audio file URL (MP3 / R2)
            type: string
            description: Paste the entire public URL of a playable audio FILE, such as https://pub-xxxx.r2.dev/Angel.mp3. The bucket root and YouTube links do not work here.
          - name: youtube_url
            label: YouTube video URL (optional)
            type: string
            description: Paste a regular YouTube video or Shorts URL; leave blank for website-only demos. Use both fields if you want audio and video.
          - name: notes
            label: Track notes
            type: text
  - name: visuals
    label: Visual Archive
    type: collection
    path: content/visuals
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: title
      fields: [title, category, published, order]
      sort: [order, title]
    fields:
      - name: title
        label: Artwork title
        type: string
        required: true
      - name: slug
        label: Unique filename slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: description
        label: Caption / description
        type: text
      - name: image
        label: Image
        type: image
        options:
          media: artwork
      - name: category
        label: Artwork category
        type: reference
        required: true
        description: Select an existing category by name. The correct ID is saved automatically. Add or rename choices under Visual Categories / Filters.
        options:
          collection: visual_categories
          value: "{fields.id}"
          label: "{fields.label}"
          search: "label,id"
      - name: published
        label: Show on website
        type: boolean
      - name: order
        label: Display order
        type: number
  - name: visual_categories
    label: Visual Categories / Filters
    type: collection
    path: content/visual-category-options
    format: json
    filename: "{fields.id}.json"
    view:
      primary: label
      fields: [label, id]
      sort: [label]
    fields:
      - name: id
        label: Category ID (set when creating a new category)
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: Technical identifier saved with artwork; normally leave unchanged after creation.
      - name: label
        label: Category name shown in the dropdown and website
        type: string
        required: true
