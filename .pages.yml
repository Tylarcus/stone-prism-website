          - name: intro
            label: Description under Visual Archive title
            type: text
          - name: description
            label: Archive introduction paragraph
            type: text
      - name: recording
        label: Individual recording page
        type: object
        fields:
          - name: intro
            label: Description under recording page title
            type: text
      - name: contact
        label: Footer & contact links (all pages)
        type: object
        fields:
          - name: heading
            label: Footer heading
            type: string
          - name: message
            label: Footer contact text
            type: text
          - name: email
            label: Public email address (optional)
            type: string
            description: Leave blank to hide; any address entered is public.
          - name: instagram
            label: Instagram URL (optional)
            type: string
          - name: youtube
            label: YouTube URL (optional)
            type: string
          - name: bandcamp
            label: Bandcamp URL (optional)
            type: string
      - name: seo
        label: Browser titles & search descriptions
        type: object
        fields:
