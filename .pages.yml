# Stone Prism — V2.3. Commit this file at the repository root.
# Pages CMS edits metadata; the site is generated from published entries.
media:
  - name: artwork
    label: Artwork uploads
    input: media/images
    output: /media/images
    categories: [image]
    rename: safe
content:
  - name: website_text
    label: Website Text & Settings
    type: file
    path: content/site-text.json
    format: json
    fields:
      - name: home
        label: Homepage
        type: object
        fields:
          - name: tagline
            label: Text under Stone Prism logo
            type: text
          - name: about
            label: About paragraph
            type: text
          - name: music_link
            label: Music section link label
            type: string
          - name: visuals_link
            label: Visual archive link label
            type: string
      - name: music
        label: Music page
        type: object
        fields:
          - name: intro
            label: Description under Music title
            type: text
          - name: library_label
            label: Music library small heading
            type: string
          - name: library_heading
            label: Music library heading
            type: string
          - name: empty_all
            label: No recordings message
            type: text
          - name: empty_official
            label: No official releases message
            type: text
          - name: empty_demo
            label: No demos message
            type: text
      - name: visuals
        label: Visual Archive page
        type: object
