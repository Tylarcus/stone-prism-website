name: Stone Prism — verify music player
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check script.js
          node --check player-v3.js
          node --check tools/build.mjs
          node --check tools/test-music.mjs
          node --check tools/test-ui-v35.mjs
      - name: Build published content
        run: node tools/build.mjs
      - name: Test audio and video separation
        run: |
          node tools/test-music.mjs
          node tools/test-player-v3.mjs
          node tools/test-ui-v35.mjs
          python3 tools/test_waveforms.py
