# Optional: activate after connecting this site to a GitHub repository.
# Pages CMS edits content files; this workflow rebuilds published content.
name: Stone Prism — publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy MP3s chosen in Pages CMS into Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d media/audio ]] || ! find media/audio -maxdepth 1 -type f -iname '*.mp3' | grep -q .; then
            echo "No CMS-uploaded MP3 files to synchronize."
            exit 0
          fi
          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_BUCKET}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::CMS MP3 upload requires four GitHub Actions secrets: R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. See CMS_AUDIO_UPLOAD_SETUP.md."
            exit 1
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "::error::AWS CLI not available on the runner. Do not publish unsynchronized MP3s."
            exit 1
          fi
          aws s3 sync media/audio/ "s3://${R2_BUCKET}/cms-audio/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --exclude '*' --include '*.mp3' \
            --content-type 'audio/mpeg' --only-show-errors
          echo "CMS MP3 staging synchronized to R2. Existing objects are never deleted."
      - name: Generate published content
        run: node tools/build.mjs
      - name: Verify media fields and player
        run: |
          node --check script.js
          node --check player-v3.js
          node --check tools/test-ui-v35.mjs
          node --check tools/test-layout-ui.mjs
          node --check tools/test-cms-inheritance.mjs
          node --check tools/test-cache-bust.mjs
          node --check tools/render-site-text.mjs
          node --check tools/test-seo.mjs
          node --check tools/build.mjs
          node tools/test-music.mjs
          node tools/test-ui-v35.mjs
          node tools/test-layout-ui.mjs
          node tools/test-cms-inheritance.mjs
          node tools/test-cache-bust.mjs
          node tools/test-seo.mjs
          node tools/test-player-v3.mjs
          python3 tools/test_waveforms.py
      - name: Cache portable FFmpeg for waveform generation
        uses: actions/cache@v4
        with:
          path: .wave-tools
          key: stoneprism-imageio-ffmpeg-0.8.1-${{ runner.os }}-${{ runner.arch }}
      - name: Prepare waveform decoder without system package installation
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Using the system FFmpeg binary"
          elif [ -d ".wave-tools/imageio_ffmpeg" ]; then
            echo "Using previously cached portable FFmpeg"
          else
            echo "Attempting pinned portable FFmpeg wheel, without apt-get"
            timeout 100s python3 -m pip install --target .wave-tools --disable-pip-version-check --only-binary=:all: -q imageio-ffmpeg==0.8.1 || echo "::warning::Waveform tool unavailable; website publishing will continue"
          fi
      - name: Generate lightweight static waveform peaks from R2 MP3s
        run: python3 tools/build_waveforms.py
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html music.html visuals.html recording.html styles.css script.js player-v3.js _site/
          cp -R assets data _site/
          # Album art belongs in Pages; MP3s belong only in R2, not the published Pages bundle.
          if [ -d media/images ]; then mkdir -p _site/media; cp -R media/images _site/media/; fi
          touch _site/.nojekyll
      - name: Render editable website text into static pages
        run: node tools/render-site-text.mjs _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
