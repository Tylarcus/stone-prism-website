# Optional: activate after connecting this site to a GitHub repository.
# Pages CMS edits content files; this workflow rebuilds published content.
name: Stone Prism — publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate published content
        run: node tools/build.mjs
      - name: Verify media fields and player
        run: |
          node --check script.js
          node --check tools/build.mjs
          node tools/test-music.mjs
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html music.html visuals.html recording.html styles.css script.js _site/
          cp -R assets data _site/
          if [ -d media ]; then cp -R media _site/; fi
          touch _site/.nojekyll
      - name: Render editable website text into static pages
        run: node tools/render-site-text.mjs _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
