name: Malevolent Tina Lab — build check only
on:
  push:
    branches:
      - experiment/malevolent-tina-lab
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Check original homepage extraction (no packages)
        run: npm test --prefix lab
      - name: Install prototype dependencies
        run: npm install --prefix lab --no-audit --no-fund
      - name: Compile TinaCMS and Astro
        run: npm run build --prefix lab
